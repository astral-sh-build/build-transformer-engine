name: TransformerEngine Metapackage

permissions: {}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      TRANSFORMER_ENGINE_VERSION:
        description: "TransformerEngine version"
        required: true
        default: "v2.11"
        type: string
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  plan-matrix:
    name: Plan TransformerEngine metapackage build matrix
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read # for actions/checkout
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6
        with:
          version: "0.9.26"

      - name: Generate build matrix
        id: generate-matrix
        run: |
          set -euxo pipefail
          echo "matrix=$(uv run --script plan-matrix.py)" >> $GITHUB_OUTPUT
        env:
          LIMIT_MATRIX: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-build') && '1' || '0' }}

  build-wheels:
    name: Build Wheel
    needs: [plan-matrix]
    runs-on: ${{ matrix.RUNNER }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}

    permissions:
      contents: write
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}

    steps:
      - name: Determine TransformerEngine version
        id: transformer-engine-version
        run: |
          # Extract TransformerEngine version from tag. Tags can be either:
          # - v2.9 (legacy format; maps directly to TransformerEngine version)
          # - v2.9-r1 (new format; strip -rN suffix to get TransformerEngine version)
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            # Remove -rN suffix if present
            TRANSFORMER_ENGINE_VERSION="${TAG%-r*}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TRANSFORMER_ENGINE_VERSION="${INPUTS_TRANSFORMER_ENGINE_VERSION}"
          else
            TRANSFORMER_ENGINE_VERSION="v2.11"
          fi
          echo "version=${TRANSFORMER_ENGINE_VERSION}" >> $GITHUB_OUTPUT
          echo "Using TransformerEngine version: ${TRANSFORMER_ENGINE_VERSION}"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUTS_TRANSFORMER_ENGINE_VERSION: ${{ inputs.TRANSFORMER_ENGINE_VERSION }}

      - name: Checkout TransformerEngine
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: NVIDIA/TransformerEngine
          ref: ${{ steps.transformer-engine-version.outputs.version }}
          persist-credentials: false

      - name: Get source commit SHA
        id: source-commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Checkout utils
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: build_scripts
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Prepare build environment
        run: |
          bash build_scripts/prepare_for_build.sh ${{ steps.transformer-engine-version.outputs.version }}

      - name: Build wheel for TransformerEngine Metapackage ${{ matrix.te-version }}
        run: |
          uv build --wheel --out-dir dist
        env:
          NVTE_BUILD_METAPACKAGE: "1"
          NVTE_RELEASE_BUILD: "1"

      - name: Embed SBOM into wheel
        run: |
          for wheel in dist/*.whl; do
            uv run --script build_scripts/embed_patches.py "$wheel" "build_scripts/patches/${TRANSFORMER_ENGINE_VERSION}" \
              --source-repo "https://github.com/NVIDIA/TransformerEngine" \
              --source-tag "${TRANSFORMER_ENGINE_VERSION}" \
              --source-commit "${SOURCE_COMMIT}" \
              --build-repo "https://github.com/astral-sh-build/build-transformer-engine" \
              --build-commit "${BUILD_COMMIT}"
          done
        env:
          TRANSFORMER_ENGINE_VERSION: ${{ steps.transformer-engine-version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.sha }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log Built Wheels
        run: |
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          ls dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'release'
        with:
          name: ${{env.wheel_name}}
          path: dist/${{env.wheel_name}}
          if-no-files-found: error

      - name: Upload wheels to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          files: ./dist/*.whl
          tag_name: ${{ github.ref_name }}
          append_body: true
