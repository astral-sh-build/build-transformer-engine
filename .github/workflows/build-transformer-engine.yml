name: TransformerEngine Metapackage

permissions: {}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_tag || github.sha }}
  cancel-in-progress: true

jobs:
  plan-matrix:
    name: Plan TransformerEngine metapackage build matrix
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Generate build matrix
        id: generate-matrix
        run: |
          set -euxo pipefail
          echo "matrix=$(uv run --script plan-matrix.py)" >> "$GITHUB_OUTPUT"
        env:
          LIMIT_MATRIX: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-build') && '1' || '0' }}

  build-wheel:
    name: Build TransformerEngine metapackage wheel (CUDA ${{ matrix.MANYLINUX_CUDA_VERSION }}, PyTorch ${{ matrix.MATRIX_TORCH_VERSION }})
    needs: [plan-matrix]
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}

    steps:
      - name: Determine TransformerEngine version
        id: transformer-engine-version
        run: |
          # Extract TransformerEngine version from tag. Tags can be either:
          # - v2.9 (legacy format; maps directly to TransformerEngine version)
          # - v2.9-r1 (new format; strip -rN suffix to get TransformerEngine version)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUTS_RELEASE_TAG}"
            # Remove -rN suffix if present.
            TRANSFORMER_ENGINE_VERSION=$(sed -E 's/-r[0-9]+$//' <<<"${TAG}")
          else
            TRANSFORMER_ENGINE_VERSION="v2.16"
          fi
          echo "version=${TRANSFORMER_ENGINE_VERSION}" >> $GITHUB_OUTPUT
          echo "Using TransformerEngine version: ${TRANSFORMER_ENGINE_VERSION}"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUTS_RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Checkout TransformerEngine
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: NVIDIA/TransformerEngine
          ref: ${{ steps.transformer-engine-version.outputs.version }}
          persist-credentials: false

      - name: Get source commit SHA
        id: source-commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Checkout utils
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: build_scripts
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Prepare metapackage build environment
        run: |
          uv venv --python 3.13
          uv pip install setuptools wheel

      - name: Set matching CUDA and PyTorch wheel version
        run: |
          base_version="$(head -n 1 build_tools/VERSION.txt)"
          printf '%s+cu.%s.torch.%s\n' \
            "${base_version}" \
            "${MANYLINUX_CUDA_VERSION}" \
            "${MATRIX_TORCH_VERSION}" > build_tools/VERSION.txt
          echo "Using TransformerEngine wheel version: $(head -n 1 build_tools/VERSION.txt)"
        env:
          MANYLINUX_CUDA_VERSION: ${{ matrix.MANYLINUX_CUDA_VERSION }}
          MATRIX_TORCH_VERSION: ${{ matrix.MATRIX_TORCH_VERSION }}

      - name: Build pure Python TransformerEngine metapackage wheel
        run: |
          uv build --wheel --no-build-isolation --out-dir dist
        env:
          NVTE_BUILD_METAPACKAGE: "1"
          NVTE_RELEASE_BUILD: "1"
          NVTE_FRAMEWORK: "none"
          NVTE_CUDA_ARCHS: "70;80;89;90;100;120"
          NVTE_SKIP_SUBMODULE_CHECKS_DURING_BUILD: "1"

      - name: Embed SBOM into wheel
        run: |
          for wheel in dist/*.whl; do
            uv run --script build_scripts/embed_patches.py "$wheel" "build_scripts/patches" \
              --license-expression "Apache-2.0" \
              --license-file "LICENSE:LICENSE" \
              --source-repo "https://github.com/NVIDIA/TransformerEngine" \
              --source-tag "${TRANSFORMER_ENGINE_VERSION}" \
              --source-commit "${SOURCE_COMMIT}" \
              --build-repo "https://github.com/astral-sh-build/build-transformer-engine" \
              --build-commit "${BUILD_COMMIT}"
          done
        env:
          TRANSFORMER_ENGINE_VERSION: ${{ steps.transformer-engine-version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.sha }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log Built Wheels
        run: |
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          ls dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{env.wheel_name}}
          path: dist/${{env.wheel_name}}
          if-no-files-found: error

  create-release:
    name: Create release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release create "${RELEASE_TAG}" ./dist/*.whl
          --target "${GITHUB_SHA}"
          --title "${RELEASE_TAG}"
          --notes ""
          --repo "${GITHUB_REPOSITORY}"
